<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Glowing emerald gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00aa66" />
    </linearGradient>
    
    <!-- Deep slate glow background -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer background glow -->
  <circle cx="64" cy="64" r="56" fill="url(#glowGrad)" />

  <!-- Tactical Radar concentric circles -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#00ff88" stroke-opacity="0.15" stroke-width="1" />
  <circle cx="64" cy="64" r="36" fill="none" stroke="#00ff88" stroke-opacity="0.1" stroke-width="1" />

  <!-- Cyber shield path -->
  <path d="M64,22 C84,22 92,30 92,44 C92,72 64,102 64,102 C64,102 36,72 36,44 C36,30 44,22 64,22 Z" 
        fill="#020617" 
        stroke="url(#shieldGrad)" 
        stroke-width="5" 
        stroke-linejoin="round"
        filter="drop-shadow(0px 0px 8px rgba(0, 255, 136, 0.6))" />

  <!-- Inner forensic core nodes -->
  <path d="M64,36 L64,82" stroke="#00ff88" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 4" />
  <circle cx="64" cy="44" r="5" fill="#00ff88" />
  <circle cx="64" cy="62" r="5" fill="#00ff88" />
  
  <path d="M50,56 L78,68" stroke="#00ff88" stroke-width="2" stroke-opacity="0.7" />
  <circle cx="50" cy="56" r="4" fill="#00ff88" />
  <circle cx="78" cy="68" r="4" fill="#00ff88" />
</svg>
