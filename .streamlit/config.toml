[theme]
# Security Operations Center aesthetic — dark terminal with glowing accents
primaryColor = "#00ff88"
backgroundColor = "#0a0e27"
secondaryBackgroundColor = "#1a1f3a"
textColor = "#e8f5e9"
font = "monospace"

[client]
showErrorDetails = true

[logger]
level = "error"

[browser]
gatherUsageStats = false
